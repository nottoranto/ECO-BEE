<script>
/* Backend-backed storage adapter. The existing UI can keep its key/value API,
   while data is persisted by ECO Bee's SQLite service. */
window.storage = window.storage || {
  async get(key, shared) {
    const scope = shared ? 'shared' : 'private';
    const token=sessionStorage.getItem('ecobee_farmer_token')||'';
    const res = await fetch('/api/storage/' + scope + '/' + encodeURIComponent(key),{headers:{'Authorization':'Bearer '+token}});
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('storage read failed');
    return await res.json();
  },
  async set(key, value, shared) {
    const scope = shared ? 'shared' : 'private';
    const res = await fetch('/api/storage/' + scope + '/' + encodeURIComponent(key), {
      method: 'PUT', headers: {'Content-Type':'application/json','Authorization':'Bearer '+(sessionStorage.getItem('ecobee_farmer_token')||'')},
      body: JSON.stringify({value:value})
    });
    if (!res.ok) throw new Error('storage write failed');
    return await res.json();
  }
};
</script>

/* ================= UTILITIES ================= */
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function haversineKm(a1,b1,a2,b2){ const R=6371,dLat=(a2-a1)*Math.PI/180,dLng=(b2-b1)*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function pointInPolygon(lat,lng,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1]; const hit=((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi); if(hit) inside=!inside; } return inside; }
function centroid(coords){ let lat=0,lng=0; coords.forEach(function(c){lat+=c[0];lng+=c[1];}); return [lat/coords.length, lng/coords.length]; }

/* ================= STORAGE =================
   PRIVATE(false): accounts, session, myHives_<user>, profile_<user>, uiScale
   PUBLIC(true):   plants, safetyZones, plantCatalog, feedback, agencyEdits, parkHives
*/
let mem = {};
async function sget(key, shared){ try{ const r=await window.storage.get(key,shared); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return (mem[key]!==undefined?mem[key]:null); } }
async function sset(key, shared, val){ mem[key]=val; try{ await window.storage.set(key, JSON.stringify(val), shared); return true; }catch(e){ return false; } }
async function loadArr(key, shared){ const v = await sget(key, shared); return Array.isArray(v)?v:[]; }

async function refreshCatalog(){
  const custom = await loadArr('plantCatalog', true);
  PLANT_CATALOG = Object.assign({}, DEFAULT_PLANT_DB);
  custom.forEach(function(c){ PLANT_CATALOG[c.key] = { label:c.label, icon:c.icon||'🌿', months:c.months, why:c.why||'พรรณไม้ที่หน่วยงานเพิ่มเข้าฐานข้อมูล', custom:true }; });
}

const DEFAULT_CENTER = [13.5282, 99.8134]; // ราชบุรี; ใช้ก่อนผู้ใช้อนุญาตตำแหน่ง

/* ================= UI SCALE / LIVE CLOCK ================= */
let uiScale = 1;
function applyUiScale(v){ uiScale=v; document.documentElement.style.setProperty('--ui-scale', v); document.documentElement.style.fontSize = (16*v)+'px'; }
function startLiveClock(){
  function tick(){
    const now=new Date();
    const t=now.toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' '+now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.querySelectorAll('.live-time').forEach(function(el){ el.textContent=t; });
  }
  tick(); setInterval(tick, 1000);
}

/* ================= SESSION / AUTH ================= */
let session = null; // { phone }
let profile = null; // { name, farm }
async function api(path, options){
  options=options||{}; options.headers=Object.assign({'Content-Type':'application/json'},options.headers||{});
  if(session&&session.token) options.headers.Authorization='Bearer '+session.token;
  const response=await fetch(path,options), data=await response.json();
  if(!response.ok){ const labels={unauthorized:'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่',invalid_credentials:'เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง',phone_exists:'เบอร์โทรนี้สมัครสมาชิกแล้ว',invalid_phone:'กรุณากรอกเบอร์โทร 9–10 หลัก',weak_password:'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร',missing_fields:'กรุณากรอกข้อมูลให้ครบ',not_found:'ไม่พบข้อมูลที่ต้องการ',hive_not_found:'ไม่พบรังผึ้งที่เลือก',invalid_quantity:'ปริมาณต้องมากกว่า 0',internal_error:'ระบบขัดข้อง กรุณาลองใหม่อีกครั้ง'}; const err=new Error(labels[data.error]||data.error||'ไม่สามารถเชื่อมต่อระบบได้');err.code=data.error;err.status=response.status;throw err; }
  return data;
}

async function doLogin(){
  try {
    const phone = document.getElementById('a-phone').value.trim();
    const pass = document.getElementById('a-pass').value;
    if(!phone || !pass){ showToast('info','กรอกไม่ครบ','กรุณากรอกเบอร์โทรและรหัสผ่าน'); return; }
    const auth=await api('/api/auth/login',{method:'POST',body:JSON.stringify({phone:phone,password:pass})});
    session = { phone:phone, token:auth.token };
    sessionStorage.setItem('ecobee_farmer_token',auth.token);
    await sset('profile_'+phone,false,{name:auth.user.name,farm:auth.user.farm});
    await enterApp();
  } catch(err) {
    showToast('alert','เข้าสู่ระบบไม่สำเร็จ',err.message);
  }
}
async function doRegister(){
  try {
    const name = document.getElementById('r-name').value.trim();

    const pass = document.getElementById('r-pass').value;

    session = { phone:phone, token:auth.token }; sessionStorage.setItem('ecobee_farmer_token',auth.token);

let map, satelliteLayer, streetLayer, usingSatellite=true;
function initMap(center){
  map = L.map('map', { zoomControl:false, attributionControl:true }).setView(center, 14);
  satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Tiles &copy; Esri' });
  streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' });
  satelliteLayer.addTo(map);
  document.getElementById('zoom-in').addEventListener('click', function(){ map.zoomIn(); });
  document.getElementById('zoom-out').addEventListener('click', function(){ map.zoomOut(); });
  document.getElementById('layer-toggle').addEventListener('click', function(){
    if(usingSatellite){ map.removeLayer(satelliteLayer); streetLayer.addTo(map); this.innerHTML='<i class="fa-solid fa-satellite"></i>'; }
    else { map.removeLayer(streetLayer); satelliteLayer.addTo(map); this.innerHTML='<i class="fa-solid fa-layer-group"></i>'; }
    usingSatellite=!usingSatellite;
  });
  document.getElementById('locate-btn').addEventListener('click', function(){
    if(!navigator.geolocation){ showToast('info','ไม่รองรับ','อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง'); return; }
    navigator.geolocation.getCurrentPosition(function(p){ map.flyTo([p.coords.latitude,p.coords.longitude],16); }, function(){ showToast('info','ระบุตำแหน่งไม่ได้','กรุณาอนุญาตการเข้าถึงตำแหน่ง'); });
  });
  map.on('click', onMapClick);
  map.on('contextmenu', function(){ if((mode==='drawPlantArea'||mode==='drawSafe'||mode==='drawDanger')&&drawVertices.length){ drawVertices.pop(); updateDrawPreview(); } });
  map.on('moveend', function(){ if(!document.getElementById('sheet-panel-calendar').classList.contains('hidden')) renderCalendar(map.getCenter().lat, map.getCenter().lng); });
}

const toastTheme = {

  plant:{bg:'bg-emerald-100',text:'text-emerald-600',icon:'fa-solid fa-seedling'},

};
function showToast(type, title, message){
  const theme = toastTheme[type]||toastTheme.info;
  const t = document.createElement('div');
  t.className='toast-in pointer-events-auto w-full max-w-sm bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden';
  t.innerHTML='<div class="flex items-start gap-3 p-4"><div class="w-9 h-9 rounded-xl '+theme.bg+' '+theme.text+' flex items-center justify-center shrink-0"><i class="'+theme.icon+'"></i></div><div class="flex-1 min-w-0"><p class="text-sm font-semibold text-gray-800">'+escapeHtml(title)+'</p>'+(message?'<p class="text-xs text-gray-500 mt-1 leading-relaxed">'+escapeHtml(message)+'</p>':'')+'</div><button class="tc text-gray-300 hover:text-gray-500 shrink-0"><i class="fa-solid fa-xmark"></i></button></div>';
  document.getElementById('toast-container').appendChild(t);
  function rm(){ t.classList.remove('toast-in'); t.classList.add('toast-out'); setTimeout(function(){ t.remove(); }, 300); }

}

/* ================= RENDER LAYERS (with delete buttons in popups) ================= */
function clearRefs(a){ a.forEach(function(l){ map.removeLayer(l); }); a.length=0; }
function renderHives(){
  clearRefs(hiveRefs); if(!hivesVisible) return;
  myHives.forEach(function(h){
    const spec = SPECIES_DB[h.species]||SPECIES_DB.meliponini;
    const radius = h.radiusKm||spec.radiusKm;
    const icon = L.divIcon({ className:'', html:'<div class="map-pin map-pin-amber"><svg viewBox="0 0 24 24" fill="white"><use href="#icon-hive"/></svg></div>', iconSize:[34,34], iconAnchor:[17,17] });
    const m = L.marker([h.lat,h.lng],{icon:icon}).addTo(map);
    m.bindPopup('<div class="popup-title">🐝 '+escapeHtml(h.name||'รังผึ้งของฉัน')+' <span style="font-size:10px;color:#f59e0b">🔒 ส่วนตัว</span></div>' +
      '<div class="popup-row"><span>สายพันธุ์</span><b>'+escapeHtml(spec.label)+'</b></div>' +
      '<div class="popup-row"><span>รัศมีหาอาหาร</span><b>'+radius+' กม.</b></div>' +
      (h.note?'<div class="popup-row"><span>บันทึก</span><b>'+escapeHtml(h.note)+'</b></div>':'') +
      '<button data-delhive class="popup-del-btn"><i class="fa-solid fa-trash-can mr-1"></i>ลบรังนี้</button>');
    m.on('popupopen', function(e){ const el=e.popup.getElement().querySelector('[data-delhive]'); if(el) el.addEventListener('click', function(){ deleteHive(h.id); }); });
    const c = L.circle([h.lat,h.lng],{ radius: radius*1000, color:'#f59e0b', weight:2, fillColor:'#f59e0b', fillOpacity:0.07 }).addTo(map);
    hiveRefs.push(m,c);
  });
}
function renderPlants(){
  clearRefs(plantRefs);
  plants.forEach(function(p){
    const plant = PLANT_CATALOG[p.type]||{label:p.type,icon:'🌿'};
    const name = plant.label + (p.variety?(' · พันธุ์'+escapeHtml(p.variety)):'');
    const canDelete = p.ownerPhone === session.phone;
    const html='<div class="popup-title">'+plant.icon+' '+escapeHtml(name)+'</div>'+(p.note?'<div class="popup-row"><span>บันทึก</span><b>'+escapeHtml(p.note)+'</b></div>':'')+'<div class="popup-row"><span>ผู้บันทึก</span><b>'+escapeHtml(p.ownerName||'ไม่ระบุ')+'</b></div>'+(canDelete?'<button data-delplant class="popup-del-btn"><i class="fa-solid fa-trash-can mr-1"></i>ลบข้อมูลนี้</button>':'');
    if(p.geom.type==='point'){
      const icon=L.divIcon({className:'',html:'<div class="map-pin map-pin-emerald"><i class="fa-solid fa-seedling" style="color:white"></i></div>',iconSize:[34,34],iconAnchor:[17,17]});
      const m=L.marker(p.geom.coords,{icon:icon}).addTo(map); m.bindPopup(html);
      if(canDelete) m.on('popupopen', function(e){ const el=e.popup.getElement().querySelector('[data-delplant]'); if(el) el.addEventListener('click', function(){ deletePlant(p.id); }); });
      plantRefs.push(m);
    } else {
      const poly=L.polygon(p.geom.coords,{color:'#10b981',weight:2,fillColor:'#10b981',fillOpacity:0.18}).addTo(map); poly.bindPopup(html);
      if(canDelete) poly.on('popupopen', function(e){ const el=e.popup.getElement().querySelector('[data-delplant]'); if(el) el.addEventListener('click', function(){ deletePlant(p.id); }); });
      plantRefs.push(poly);
    }
  });
}
function renderZones(){
  clearRefs(zoneRefs);
  zones.forEach(function(z){
    const dz = z.status==='danger';
    const canDelete = z.ownerPhone === session.phone;
    const poly=L.polygon(z.geom.coords,{color:dz?'#f43f5e':'#10b981',weight:2,fillColor:dz?'#f43f5e':'#10b981',fillOpacity:0.16}).addTo(map);
    poly.bindPopup('<div class="popup-title">'+(dz?'⚠️ '+escapeHtml(z.name||'พื้นที่เสี่ยงสารเคมี'):'✅ '+escapeHtml(z.name||'พื้นที่ปลอดภัย'))+'</div>'+(z.note?'<div class="popup-row"><span>รายละเอียด</span><b>'+escapeHtml(z.note)+'</b></div>':'')+'<div class="popup-row"><span>ผู้บันทึก</span><b>'+escapeHtml(z.ownerName||'ไม่ระบุ')+'</b></div>'+(canDelete?'<button data-delzone class="popup-del-btn"><i class="fa-solid fa-trash-can mr-1"></i>ลบพื้นที่นี้</button>':''));
    if(canDelete) poly.on('popupopen', function(e){ const el=e.popup.getElement().querySelector('[data-delzone]'); if(el) el.addEventListener('click', function(){ deleteZone(z.id); }); });
    zoneRefs.push(poly);
  });
}
function renderAll(){ renderHives(); renderPlants(); renderZones(); buildSearchIndex(); }

function buildSearchIndex(){
  searchIndex = {};
  myHives.forEach(function(h){ searchIndex[(h.name||'').toLowerCase()] = {lat:h.lat,lng:h.lng,label:h.name,type:'รังผึ้ง'}; });
  zones.forEach(function(z){ if(z.name){ const c=centroid(z.geom.coords); searchIndex[z.name.toLowerCase()]={lat:c[0],lng:c[1],label:z.name,type: z.status==='danger'?'จุดเสี่ยง':'พื้นที่ปลอดภัย'}; } });
}

async function deleteHive(id){

/* ================= MODE / DRAWING STATE MACHINE ================= */
let mode = null; // 'placeHive' | 'placePlantPoint' | 'drawPlantArea' | 'drawSafe' | 'drawDanger'
let drawVertices = [];
let drawPreviewLayers = [];

const modeBanner = document.getElementById('mode-banner');
const modeBannerText = document.getElementById('mode-banner-text');
const modeUndo = document.getElementById('mode-undo');
const modeFinish = document.getElementById('mode-finish');
const modeCancel = document.getElementById('mode-cancel');

function showModeBanner(text, isPolygon){
  modeBannerText.textContent = text;
  modeBanner.classList.remove('hidden');
  modeUndo.style.display = isPolygon ? 'flex' : 'none';
  modeFinish.style.display = isPolygon ? 'flex' : 'none';
  document.getElementById('map').classList.add('map-crosshair');
  setSheet(false);
}
function hideModeBanner(){
  modeBanner.classList.add('hidden');
  document.getElementById('map').classList.remove('map-crosshair');
}
function clearDrawPreview(){ drawPreviewLayers.forEach(function(l){ map.removeLayer(l); }); drawPreviewLayers = []; drawVertices = []; }

function armMode(action){
  if(action === 'hive'){ mode = 'placeHive'; showModeBanner('แตะบนแผนที่เพื่อปักหมุดตำแหน่งรังผึ้งของคุณ (ข้อมูลส่วนตัว)', false); }
  else if(action === 'plantPoint'){ mode = 'placePlantPoint'; showModeBanner('แตะบนแผนที่เพื่อปักหมุดตำแหน่งต้นไม้หรือดอกไม้ 1 ต้น', false); }
  else if(action === 'plantArea'){ mode = 'drawPlantArea'; drawVertices=[]; showModeBanner('แตะบนแผนที่หลายจุดเพื่อล้อมขอบเขตแปลงพืช · แตะจุดเริ่มต้นเพื่อปิดพื้นที่', true); }
  else if(action === 'danger'){ mode = 'drawDanger'; drawVertices=[]; showModeBanner('แตะบนแผนที่หลายจุดเพื่อล้อมพื้นที่ที่พบสารเคมี · แตะจุดเริ่มต้นเพื่อปิดพื้นที่', true); }
}
function cancelMode(){ clearDrawPreview(); hideModeBanner(); mode = null; }
modeCancel.addEventListener('click', cancelMode);
modeUndo.addEventListener('click', function(){ if(drawVertices.length){ drawVertices.pop(); updateDrawPreview(); } });
modeFinish.addEventListener('click', function(){ finishPolygonDraw(); });

function updateDrawPreview(){
  drawPreviewLayers.forEach(function(l){ map.removeLayer(l); }); drawPreviewLayers = [];
  if(drawVertices.length){
    const color = mode === 'drawDanger' ? '#f43f5e' : '#10b981';
    const poly = L.polygon(drawVertices, { color: color, weight:2, dashArray:'6 6', fillOpacity:0.12 }).addTo(map);
    drawPreviewLayers.push(poly);
    drawVertices.forEach(function(v){
      const m = L.circleMarker(v, { radius:5, color:'#1f2937', fillColor:'#fff', fillOpacity:1, weight:2 }).addTo(map);
      drawPreviewLayers.push(m);
    });
  }
}
function finishPolygonDraw(){
  if(drawVertices.length < 3){ showToast('info','ต้องมีอย่างน้อย 3 จุด','กรุณาแตะเพิ่มอีก ' + (3-drawVertices.length) + ' จุดบนแผนที่'); return; }
  const coords = drawVertices.slice();
  const targetMode = mode;
  clearDrawPreview(); hideModeBanner(); mode = null;
  if(targetMode === 'drawDanger'){ openZoneForm(coords, 'danger'); }
  else { openPlantForm({ type:'polygon', coords: coords }); }
}

function onMapClick(e){
  if(mode === 'placeHive'){ preHivePlacementAdvice(e.latlng); }
  else if(mode === 'placePlantPoint'){ openPlantForm({ type:'point', coords:[e.latlng.lat, e.latlng.lng] }); hideModeBanner(); mode = null; }
  else if(mode === 'drawPlantArea' || mode === 'drawDanger'){
    if(drawVertices.length >= 3){
      const firstPt = map.latLngToContainerPoint(L.latLng(drawVertices[0]));
      const clickPt = map.latLngToContainerPoint(e.latlng);
      if(firstPt.distanceTo(clickPt) < 20){ finishPolygonDraw(); return; }
    }
    drawVertices.push([e.latlng.lat, e.latlng.lng]);
    updateDrawPreview();
  }
}

/* ---- pre-placement advice for a hive ---- */
function analyzePoint(lat,lng){
  let inDanger=null;
  for(const z of zones){ if(z.status==='danger' && pointInPolygon(lat,lng,z.geom.coords)){ inDanger=z; break; } }
  let nearDanger=Infinity;
  zones.forEach(function(z){ if(z.status==='danger'){ const c=centroid(z.geom.coords); const d=haversineKm(lat,lng,c[0],c[1]); if(d<nearDanger) nearDanger=d; } });
  let nearOwn=Infinity;
  myHives.forEach(function(h){ const spec=SPECIES_DB[h.species]||SPECIES_DB.meliponini; const r=h.radiusKm||spec.radiusKm; const d=haversineKm(lat,lng,h.lat,h.lng); if(d<nearOwn) nearOwn=d; });
  const types={}; let monthsCovered=new Array(12).fill(0);
  plants.forEach(function(p){ const pt=p.geom.type==='point'?p.geom.coords:centroid(p.geom.coords); if(haversineKm(lat,lng,pt[0],pt[1])<=2){ types[p.type]=true; const pl=PLANT_CATALOG[p.type]; if(pl) pl.months.forEach(function(m){ monthsCovered[m]++; }); } });
  const monthGaps = monthsCovered.filter(function(v){ return v===0; }).length;
  return { inDanger, nearDanger, nearOwn, plantTypes:Object.keys(types).length, monthGaps };
}
function preHivePlacementAdvice(latlng){
  hideModeBanner(); mode=null;
  const a = analyzePoint(latlng.lat, latlng.lng);
  const rows=[];
  if(a.inDanger){ rows.push(['rose','fa-triangle-exclamation','อยู่ในพื้นที่เสี่ยงสารเคมี'+(a.inDanger.note?(' ('+a.inDanger.note+')'):''),'ไม่แนะนำให้วางรังบริเวณนี้']); }
  else if(a.nearDanger!==Infinity && a.nearDanger<1){ rows.push(['amber','fa-triangle-exclamation','ใกล้พื้นที่เสี่ยงสารเคมี (~'+a.nearDanger.toFixed(2)+' กม.)','ควรเว้นระยะให้มากขึ้น']); }
  else { rows.push(['emerald','fa-shield','ไม่พบพื้นที่เสี่ยงสารเคมีใกล้เคียง','ปลอดภัยด้านสารเคมี']); }
  if(a.nearOwn!==Infinity && a.nearOwn<0.5){ rows.push(['amber','fa-hive','ใกล้รังของคุณเอง (~'+a.nearOwn.toFixed(2)+' กม.)','อาจแย่งอาหารกันเอง ควรเว้นระยะ']); }
  else if(a.nearOwn!==Infinity){ rows.push(['emerald','fa-hive','ห่างจากรังอื่นของคุณ '+a.nearOwn.toFixed(2)+' กม.','ระยะเหมาะสม']); }
  if(a.plantTypes>=2){ rows.push(['emerald','fa-seedling','มีพืชอาหาร '+a.plantTypes+' ชนิดในรัศมี 2 กม.','แหล่งอาหารหลากหลาย']); }
  else { rows.push(['amber','fa-seedling','พบพืชอาหารเพียง '+a.plantTypes+' ชนิดในรัศมี 2 กม.','ควรปลูกเสริมก่อน']); }
  if(a.monthGaps>0){ rows.push(['amber','fa-calendar-xmark','มีเดือนที่ไม่พบพืชอาหาร '+a.monthGaps+' เดือน','ดูแท็บปฏิทินเพื่อวางแผนปลูกเสริม']); }
  else { rows.push(['emerald','fa-calendar-check','พบพืชอาหารครบทุกเดือน','แหล่งอาหารต่อเนื่องทั้งปี']); }

  const rowsHtml = rows.map(function(r){ return '<div class="flex items-start gap-2.5 p-3 rounded-xl bg-'+r[0]+'-50 border border-'+r[0]+'-100"><i class="fa-solid '+r[1]+' text-'+r[0]+'-500 mt-0.5"></i><div><p class="text-sm font-semibold text-gray-700">'+escapeHtml(r[2])+'</p><p class="text-xs text-gray-500">'+escapeHtml(r[3])+'</p></div></div>'; }).join('');
  const risky = a.inDanger || (a.nearOwn<0.5) || a.plantTypes<2;
  openModal(
    '<div class="w-11 h-11 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center mb-3"><i class="fa-solid fa-clipboard-check"></i></div>'+
    '<h3 class="font-display font-bold text-lg text-gray-800">ผลวิเคราะห์จุดที่เลือก</h3>'+
    '<p class="text-gray-400 text-xs mt-1 mb-3">ตรวจสอบก่อนวางรังผึ้งบริเวณนี้</p>'+
    '<div class="space-y-2">'+rowsHtml+'</div>'+
    (risky?'<p class="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-xl px-3 py-2.5 mt-3"><i class="fa-solid fa-circle-info mr-1"></i>จุดนี้มีข้อควรระวัง คุณยังวางได้ แต่โปรดพิจารณาคำแนะนำข้างต้น</p>':'')+
    '<div class="flex gap-2.5 mt-4"><button id="pp-cancel" class="flex-1 h-11 rounded-xl border border-gray-200 text-gray-500 font-semibold text-sm">เลือกจุดอื่น</button><button id="pp-go" class="flex-1 h-11 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-semibold text-sm">วางรังที่นี่</button></div>'

/* ================= CALENDAR ANALYSIS ================= */
const ANALYSIS_RADIUS_KM=2;
let calMonthSel=new Date().getMonth();
function computeCalendar(lat,lng){
  const cover=[]; for(let i=0;i<12;i++) cover.push([]);
  plants.forEach(function(p){ const pt=p.geom.type==='point'?p.geom.coords:centroid(p.geom.coords); if(haversineKm(lat,lng,pt[0],pt[1])<=ANALYSIS_RADIUS_KM){ const pl=PLANT_CATALOG[p.type]; if(pl) pl.months.forEach(function(m){ if(cover[m].indexOf(pl.label)===-1) cover[m].push(pl.label); }); } });
  return monthFullTh.map(function(name,i){ return { name:name, short:monthShortTh[i], has:cover[i].length>0, plants:cover[i] }; });
}
function recommendForMonth(monthIndex, already){
  const cands=[];
  Object.keys(PLANT_CATALOG).forEach(function(k){ const p=PLANT_CATALOG[k]; if(p.months.indexOf(monthIndex)!==-1 && already.indexOf(p.label)===-1) cands.push(p); });
  return cands.slice(0,2);
}
function renderCalendar(lat,lng){
  const data=computeCalendar(lat,lng);
  const noFood=data.filter(function(m){ return !m.has; }).length;
  const p=document.getElementById('sheet-panel-calendar');
  let head='<p class="text-xs text-gray-400 mb-3 leading-relaxed"><i class="fa-solid fa-circle-info text-amber-400 mr-1"></i>ดูจากพืชอาหารที่บันทึกไว้ในรัศมี '+ANALYSIS_RADIUS_KM+' กม. รอบกลางแผนที่ · เลื่อนแผนที่เพื่อดูพื้นที่อื่น</p>';
  head += noFood===0
    ? '<div class="rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold px-3.5 py-2.5 mb-3 flex items-center gap-2"><i class="fa-solid fa-circle-check"></i>มีพืชอาหารครบทั้ง 12 เดือน</div>'
    : '<div class="rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold px-3.5 py-2.5 mb-3 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i>มี '+noFood+' เดือนที่ไม่พบพืชอาหาร</div>';
  let grid='<div class="grid grid-cols-4 gap-2 mb-4">';
  data.forEach(function(m,i){ const on=m.has; grid+='<button data-cm="'+i+'" class="cal-cell text-left rounded-xl border p-2.5 transition-all '+(on?'bg-emerald-50 border-emerald-200':'bg-rose-50 border-rose-200')+'"><div class="flex items-center justify-between mb-1.5"><span class="font-display font-bold text-xs text-gray-800">'+m.short+'</span><span class="w-1.5 h-1.5 rounded-full '+(on?'bg-emerald-500':'bg-rose-500')+'"></span></div><p class="text-[9px] font-semibold '+(on?'text-emerald-600':'text-rose-600')+'">'+(on?'มีพืชอาหาร':'ไม่มี')+'</p></button>'; });
  grid+='</div><div id="cal-detail"></div>';
  p.innerHTML=head+grid;
  p.querySelectorAll('.cal-cell').forEach(function(btn){ btn.addEventListener('click', function(){ calMonthSel=+btn.dataset.cm; renderCalDetail(data); }); });
  if(calMonthSel>=data.length) calMonthSel=0;
  renderCalDetail(data);
}
function renderCalDetail(data){
  const m=data[calMonthSel]; const el=document.getElementById('cal-detail'); if(!el) return;
  let body;
  if(m.has){
    body='<div class="rounded-2xl border p-4 bg-emerald-50 border-emerald-200"><p class="text-xs font-semibold text-emerald-600 mb-1.5">'+m.name+' · มีพืชอาหาร</p><p class="text-gray-700 text-sm leading-relaxed">พืชอาหารที่พบ: '+m.plants.map(escapeHtml).join(', ')+'</p></div>';
  } else {

    let recHtml = recs.length ? recs.map(function(r){ return '<div class="bg-white/70 border border-gray-100 rounded-xl px-3.5 py-2.5 mt-2"><p class="text-sm font-semibold text-gray-700">'+r.icon+' แนะนำปลูก '+escapeHtml(r.label)+'</p><p class="text-xs text-gray-500 mt-0.5 leading-relaxed"><i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i>'+escapeHtml(r.why)+'</p></div>'; }).join('') : '<p class="text-xs text-gray-500 mt-2">ยังไม่มีคำแนะนำพืชสำหรับเดือนนี้ในฐานข้อมูล</p>';
    body='<div class="rounded-2xl border p-4 bg-rose-50 border-rose-200"><p class="text-xs font-semibold text-rose-600 mb-1.5">'+m.name+' · ไม่พบพืชอาหาร</p><p class="text-gray-700 text-sm leading-relaxed">ไม่พบพืชอาหารในรัศมี '+ANALYSIS_RADIUS_KM+' กม. สำหรับเดือนนี้</p>'+recHtml+'</div>';
  }
  el.innerHTML=body;
}

  const seen = (await sget('seenAlerts_'+session.phone, false)) || [];
  const unseen = mine.filter(function(e){ return seen.indexOf(e.id)===-1; });
  const badge=document.getElementById('alert-dot');
  const tabBadge=document.getElementById('tab-alert-badge');
  if(unseen.length){ badge.classList.remove('hidden'); badge.textContent=unseen.length; if(tabBadge){ tabBadge.classList.remove('hidden'); tabBadge.textContent=unseen.length; } }
  else { badge.classList.add('hidden'); if(tabBadge) tabBadge.classList.add('hidden'); }
}
function renderAlertsPanel(){
  const p=document.getElementById('sheet-panel-alerts');
  loadArr('agencyEdits', true).then(function(edits){
    const mine = edits.filter(function(e){ return e.targetPhone===session.phone; }).sort(function(a,b){ return b.createdAt-a.createdAt; });
    const risks=[];
    myHives.forEach(function(h){ zones.forEach(function(z){ if(z.status==='danger'){ const c=centroid(z.geom.coords); const d=haversineKm(h.lat,h.lng,c[0],c[1]); if(d<=1){ risks.push({hive:h.name, zone:z.name||'พื้นที่เสี่ยง', dist:d, note:z.note}); } } }); });
    let html='';
    html+='<h4 class="font-display font-bold text-sm text-gray-800 mb-2 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-rose-500"></i>ความเสี่ยงใกล้รังของคุณ</h4>';
    if(risks.length){ html+=risks.map(function(r){ return '<div class="rounded-xl bg-rose-50 border border-rose-200 p-3 mb-2"><p class="text-sm font-semibold text-rose-700">'+escapeHtml(r.hive)+' ใกล้ '+escapeHtml(r.zone)+'</p><p class="text-xs text-gray-600 mt-0.5">ห่าง '+r.dist.toFixed(2)+' กม.'+(r.note?(' · '+escapeHtml(r.note)):'')+'</p><p class="text-xs text-rose-600 mt-1"><i class="fa-solid fa-wrench mr-1"></i>แนวทางแก้ไข: พิจารณาย้ายรังออกห่าง หรือประสานเจ้าของแปลงเรื่องช่วงเวลาฉีดพ่น</p></div>'; }).join(''); }
    else { html+='<p class="text-xs text-gray-400 mb-4">ไม่พบความเสี่ยงใกล้รังของคุณ</p>'; }
    html+='<h4 class="font-display font-bold text-sm text-gray-800 mb-2 mt-4 flex items-center gap-2"><i class="fa-solid fa-user-shield text-amber-500"></i>การแก้ไขจากหน่วยงาน</h4>';
    if(mine.length){ html+=mine.map(function(e){ return '<div class="rounded-xl bg-amber-50 border border-amber-200 p-3 mb-2"><p class="text-sm font-semibold text-amber-700">'+escapeHtml(e.title)+'</p><p class="text-xs text-gray-600 mt-0.5 leading-relaxed">'+escapeHtml(e.detail)+'</p><p class="text-[10px] text-gray-400 mt-1">'+new Date(e.createdAt).toLocaleString('th-TH')+'</p></div>'; }).join(''); }
    else { html+='<p class="text-xs text-gray-400">ยังไม่มีการแก้ไขจากหน่วยงาน</p>'; }
    p.innerHTML=html;
    const seen=mine.map(function(e){ return e.id; });
    sset('seenAlerts_'+session.phone, false, seen);
    checkAgencyAlerts();
  });
}

/* ---- SETTINGS panel (profile, icon size, feedback, logout) ---- */
function renderSettingsPanel(){
  const p=document.getElementById('sheet-panel-settings');
  const initials=(profile.name||'EB').trim().slice(0,2);
  p.innerHTML=
    '<div class="flex items-center gap-3 mb-5"><div class="w-12 h-12 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white font-bold shrink-0">'+escapeHtml(initials)+'</div><div class="flex-1 min-w-0"><p class="font-semibold text-gray-800 text-sm truncate">'+escapeHtml(profile.name)+'</p><p class="text-xs text-gray-400 truncate">'+escapeHtml(profile.farm)+' · '+escapeHtml(session.phone)+'</p></div><button id="set-editprofile" class="text-xs font-semibold text-amber-600 shrink-0">แก้ไข</button></div>'+
    '<div class="bg-white border border-gray-200 rounded-2xl p-4 mb-3"><p class="text-sm font-semibold text-gray-700 mb-1 flex items-center gap-2"><i class="fa-solid fa-text-height text-amber-500"></i>ขนาดไอคอน/ตัวอักษร</p><p class="text-xs text-gray-400 mb-3">ปรับขนาดตัวอักษรและไอคอนทั้งเว็บไซต์ให้อ่านง่ายขึ้น</p><div class="flex gap-2" id="size-picker">'+
      sizeBtn('เล็ก',0.9)+sizeBtn('ปกติ',1)+sizeBtn('ใหญ่',1.15)+sizeBtn('ใหญ่มาก',1.3)+
    '</div></div>'+
    '<button id="set-feedback" class="w-full h-12 rounded-xl border border-gray-200 text-gray-600 text-sm font-semibold flex items-center justify-center gap-2 mb-2.5 hover:border-emerald-300 hover:text-emerald-600 transition-colors"><i class="fa-solid fa-comment-dots"></i>ส่งข้อคิดเห็น / ขอเพิ่มพรรณไม้</button>'+
    '<button id="set-logout" class="w-full h-12 rounded-xl border border-gray-200 text-gray-600 text-sm font-semibold flex items-center justify-center gap-2 hover:border-rose-300 hover:text-rose-500 transition-colors"><i class="fa-solid fa-arrow-right-from-bracket"></i>ออกจากระบบ</button>';
  document.getElementById('set-editprofile').addEventListener('click', openProfileEditor);
  document.getElementById('set-feedback').addEventListener('click', openFeedback);
  document.getElementById('set-logout').addEventListener('click', logout);
  p.querySelectorAll('[data-scale]').forEach(function(b){ b.addEventListener('click', async function(){ applyUiScale(parseFloat(b.dataset.scale)); const ok=await sset('uiScale', false, uiScale); renderHives(); renderSettingsPanel(); showToast(ok?'info':'alert', ok?'ปรับขนาดแล้ว':'บันทึกไม่สำเร็จ',''); }); });
}
function sizeBtn(label,val){ const on=Math.abs(uiScale-val)<0.001; return '<button data-scale="'+val+'" class="flex-1 h-10 rounded-xl border text-xs font-semibold '+(on?'bg-amber-500 text-white border-amber-500':'bg-white text-gray-500 border-gray-200')+'">'+label+'</button>'; }

function openProfileEditor(){
  openModal(
    '<h3 class="font-display font-bold text-lg text-gray-800 mb-4">แก้ไขโปรไฟล์</h3>'+
    '<div class="space-y-3"><div><label class="text-xs text-gray-400 mb-1 block">ชื่อ</label><input id="pe-name" value="'+escapeHtml(profile.name)+'" class="w-full h-11 rounded-xl border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"></div><div><label class="text-xs text-gray-400 mb-1 block">ชื่อฟาร์ม</label><input id="pe-farm" value="'+escapeHtml(profile.farm)+'" class="w-full h-11 rounded-xl border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"></div></div>'+
    '<div class="flex gap-2.5 mt-5"><button id="pe-cancel" class="flex-1 h-11 rounded-xl border border-gray-200 text-gray-500 font-semibold text-sm">ยกเลิก</button><button id="pe-save" class="flex-1 h-11 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-semibold text-sm">บันทึก</button></div>'
  );
  document.getElementById('pe-cancel').addEventListener('click', closeModal);
  document.getElementById('pe-save').addEventListener('click', async function(){
    const newName=document.getElementById('pe-name').value.trim()||profile.name;
    const newFarm=document.getElementById('pe-farm').value.trim()||profile.farm;
    const prevProfile = { name:profile.name, farm:profile.farm };
    profile.name=newName; profile.farm=newFarm;
    try{
      await api('/api/auth/profile',{method:'POST',body:JSON.stringify(profile)});
      const ok=await sset('profile_'+session.phone,false,profile);
      closeModal();if(!ok)throw new Error();renderSettingsPanel();showToast('safe','บันทึกแล้ว','อัปเดตโปรไฟล์เรียบร้อย');
    }catch(e){profile=prevProfile;closeModal();showToast('alert','บันทึกไม่สำเร็จ','เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');}
  });
}
function openFeedback(){
  openModal(
    '<div class="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-500 flex items-center justify-center mb-4"><i class="fa-solid fa-comment-dots"></i></div>'+
    '<h3 class="font-display font-bold text-lg text-gray-800">ส่งข้อคิดเห็นถึงหน่วยงาน</h3>'+
    '<p class="text-gray-400 text-xs mt-1 mb-4">แจ้งปัญหา หรือขอให้เพิ่มพรรณไม้เข้าฐานข้อมูล หน่วยงานจะเห็นข้อความนี้ในระบบ</p>'+
    '<div class="space-y-3">'+
      '<select id="fb-type" class="w-full h-11 rounded-xl border border-gray-200 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"><option value="plant">ขอเพิ่มพรรณไม้</option><option value="issue">แจ้งปัญหาการใช้งาน</option><option value="other">อื่นๆ</option></select>'+
      '<textarea id="fb-msg" rows="4" placeholder="พิมพ์ข้อความ เช่น อยากให้เพิ่มพืช ‘กระถินณรงค์’ ที่ออกดอกเดือน พ.ค.-มิ.ย." class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"></textarea>'+
    '</div>'+
    '<div class="flex gap-2.5 mt-5"><button id="fb-cancel" class="flex-1 h-11 rounded-xl border border-gray-200 text-gray-500 font-semibold text-sm">ยกเลิก</button><button id="fb-send" class="flex-1 h-11 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-sm">ส่ง</button></div>'
  );
  document.getElementById('fb-cancel').addEventListener('click', closeModal);
  document.getElementById('fb-send').addEventListener('click', async function(){
    const msg=document.getElementById('fb-msg').value.trim(); if(!msg){ showToast('info','กรุณาพิมพ์ข้อความ',''); return; }
    const type=document.getElementById('fb-type').value;
    let fb=await loadArr('feedback', true);
    fb.push({ id:uid(), type:type, message:msg, fromPhone:session.phone, fromName:profile.name, status:'new', createdAt:Date.now() });
    const ok = await sset('feedback', true, fb);
    closeModal();
    if(ok){ showToast('safe','ส่งข้อคิดเห็นแล้ว','ขอบคุณ หน่วยงานจะพิจารณาคำขอของคุณ'); }
    else { showToast('alert','ส่งไม่สำเร็จ','เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง'); }
  });
}

/* ================= SEARCH (place + hive/zone names) ================= */
let searchTimeout=null;
const searchInput=document.getElementById('search-input'), searchResults=document.getElementById('search-results');
searchInput.addEventListener('input', function(){ clearTimeout(searchTimeout); const q=this.value.trim(); if(q.length<2){ searchResults.classList.add('hidden'); return; } localMatches(q); searchTimeout=setTimeout(function(){ runGeoSearch(q); }, 500); });
function localMatches(q){
  const ql=q.toLowerCase();
  const local = Object.keys(searchIndex).filter(function(k){ return k.indexOf(ql)!==-1; }).map(function(k){ return searchIndex[k]; }).slice(0,4);
  if(local.length){ searchResults.innerHTML = local.map(function(it,idx){ return '<button data-local="'+idx+'" class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-amber-50 border-b border-gray-50 flex items-center gap-2.5"><i class="fa-solid '+(it.type==='รังผึ้ง'?'fa-location-dot text-amber-400':(it.type==='จุดเสี่ยง'?'fa-triangle-exclamation text-rose-400':'fa-shield text-emerald-400'))+'"></i><span class="flex-1"><span class="block font-semibold">'+escapeHtml(it.label)+'</span><span class="block text-[11px] text-gray-400">'+it.type+'</span></span></button>'; }).join(''); searchResults.classList.remove('hidden');
    searchResults.querySelectorAll('[data-local]').forEach(function(b){ b.addEventListener('click', function(){ const it=local[+b.dataset.local]; map.flyTo([it.lat,it.lng],16); searchResults.classList.add('hidden'); searchInput.value=it.label; searchInput.blur(); }); });
  }
}
async function runGeoSearch(q){
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=4&countrycodes=th&q='+encodeURIComponent(q);
    const res=await fetch(url); const data=await res.json();
    const ql=q.toLowerCase();
    const local = Object.keys(searchIndex).filter(function(k){ return k.indexOf(ql)!==-1; }).map(function(k){ return searchIndex[k]; }).slice(0,3);
    let html = local.map(function(it,idx){ return '<button data-local="'+idx+'" class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-amber-50 border-b border-gray-50 flex items-center gap-2.5"><i class="fa-solid '+(it.type==='รังผึ้ง'?'fa-location-dot text-amber-400':(it.type==='จุดเสี่ยง'?'fa-triangle-exclamation text-rose-400':'fa-shield text-emerald-400'))+'"></i><span class="flex-1"><span class="block font-semibold">'+escapeHtml(it.label)+'</span><span class="block text-[11px] text-gray-400">'+it.type+'</span></span></button>'; }).join('');
    html += data.map(function(item,idx){ return '<button data-geo="'+idx+'" class="w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-amber-50 border-b border-gray-50 last:border-0 flex items-start gap-2.5"><i class="fa-solid fa-location-dot text-gray-300 mt-0.5"></i><span>'+escapeHtml(item.display_name)+'</span></button>'; }).join('');
    if(!html) html='<div class="p-3 text-xs text-gray-400">ไม่พบผลลัพธ์</div>';
    searchResults.innerHTML=html; searchResults.classList.remove('hidden');
    searchResults.querySelectorAll('[data-local]').forEach(function(b){ b.addEventListener('click', function(){ const it=local[+b.dataset.local]; map.flyTo([it.lat,it.lng],16); searchResults.classList.add('hidden'); searchInput.value=it.label; searchInput.blur(); }); });
    searchResults.querySelectorAll('[data-geo]').forEach(function(b){ b.addEventListener('click', function(){ const item=data[+b.dataset.geo]; map.flyTo([+item.lat,+item.lon],15); searchResults.classList.add('hidden'); searchInput.value=item.display_name.split(',')[0]; searchInput.blur(); }); });
  }catch(e){ searchResults.innerHTML='<div class="p-3 text-xs text-gray-400">ไม่สามารถค้นหาได้ในขณะนี้</div>'; searchResults.classList.remove('hidden'); }
}
document.addEventListener('click', function(e){ if(!e.target.closest('#search-input')&&!e.target.closest('#search-results')) searchResults.classList.add('hidden'); });

/* ---- menu button opens alerts tab ---- */
document.getElementById('menu-btn').addEventListener('click', function(){ setActiveTab('alerts'); setSheet(true); });

/* ================= INIT ================= */
boot();
</script>
